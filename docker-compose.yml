# Arquitetura do plano: API -> fila (Redis) -> worker de ingestão -> metadados + Elasticsearch -> RAG
x-env: &env
  QUEUE_BACKEND: redis
  REDIS_URL: redis://redis:6379/0
  SEARCH_BACKEND: elasticsearch
  ELASTICSEARCH_URL: http://elasticsearch:9200
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-pro-preview}
  GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-}
  CONTEXT_BUDGET_CHARS: ${CONTEXT_BUDGET_CHARS:-400000}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DATA_DIR: /data
services:
  api:
    build: .
    environment: *env
    ports: ["8000:8000"]
    volumes: ["data:/data"]
    restart: on-failure
    depends_on:
      redis: { condition: service_started }
      elasticsearch: { condition: service_healthy }
  worker:
    build: .
    command: python -m app.run_worker
    environment: *env
    volumes: ["data:/data"]
    restart: on-failure
    depends_on:
      redis: { condition: service_started }
      elasticsearch: { condition: service_healthy }
    deploy: { replicas: 2 }
  redis:
    image: redis:7-alpine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms1g -Xmx1g" }
    volumes: ["esdata:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
volumes: { data: {}, esdata: {} }
